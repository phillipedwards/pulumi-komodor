# Publishes a GitHub Release with prebuilt provider binaries when a vX.Y.Z tag is pushed, then
# publishes the generated Node.js SDK to npmjs.
#
# Unlike release.yml/prerelease.yml (autogenerated by pulumi/ci-mgmt), this workflow does not
# depend on Pulumi's internal ESC/OIDC secrets or their PyPI/NuGet credentials. It needs no repo
# secrets at all: the GitHub Release uses the default GITHUB_TOKEN, and npm publishing authenticates
# via npm trusted publishing (OIDC) against the publisher configured on npmjs.com for this repo and
# this workflow file. Consumers install the plugin from the GitHub release, e.g.
# `pulumi plugin install resource komodor <version> --server github://api.github.com/phillipedwards/pulumi-komodor`.
name: gh-release

on:
  push:
    tags:
      - v*.*.*
  # Allows re-running a release without deleting and re-pushing the tag.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading "v" (e.g. 0.1.0). The tag must already exist.'
        required: true
        type: string

permissions:
  contents: write
  # Required for npm trusted publishing: `npm publish` exchanges this job's OIDC token for a
  # short-lived registry credential. Provenance attestation is generated off the same token.
  id-token: write

env:
  PULUMI_CONVERTER_TERRAFORM_VERSION: 1.3.0
  # `make schema` exports PULUMI_HOME=$(WORKING_DIR)/.pulumi, and runs with automatic plugin
  # acquisition disabled. The converter therefore has to be installed into that same PULUMI_HOME,
  # not the default ~/.pulumi, or tfgen panics with "no converter plugin found".
  PULUMI_HOME: ${{ github.workspace }}/.pulumi

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Determine provider version
        # Passed through env rather than interpolated into the script directly, so a crafted
        # dispatch input cannot inject shell.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          # The Makefile rejects a leading "v", so fail loudly rather than mid-build.
          case "$version" in
            v*) echo "::error::version must not start with 'v', got '$version'"; exit 1 ;;
          esac
          echo "PROVIDER_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"

      # Provides Go and the Pulumi CLI at the versions pinned in .config/mise.toml, which derives
      # them from provider/go.mod. This is also what every ci-mgmt-generated workflow uses; every
      # `make` target here depends on it.
      - name: Setup mise
        uses: jdx/mise-action@146a28175021df8ca24f8ee1828cc2a60f980bd5 # v3
        env:
          MISE_FETCH_REMOTE_VERSIONS_TIMEOUT: 30s
        with:
          version: 2025.11.6
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install terraform converter plugin
        run: pulumi plugin install converter terraform "$PULUMI_CONVERTER_TERRAFORM_VERSION"

      - name: Generate schema
        run: make schema

      - name: Build and package all platforms
        env:
          SKIP_SIGNING: "true"
        run: |
          # provider_dist covers linux/darwin amd64+arm64 and windows-amd64; windows-arm64 is a
          # separate target because it is excluded from the provider_dist aggregate.
          make provider_dist
          make provider_dist-windows-arm64

      - name: Calculate checksums
        working-directory: bin
        run: shasum -a 256 *.tar.gz > "pulumi-komodor_${PROVIDER_VERSION}_checksums.txt"

      - name: Verify release artifacts
        working-directory: bin
        run: |
          expected=6
          actual=$(ls -1 *.tar.gz | wc -l)
          if [ "$actual" -ne "$expected" ]; then
            echo "::error::expected $expected platform archives, found $actual"
            ls -la
            exit 1
          fi
          ls -la *.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            bin/*.tar.gz
            bin/*_checksums.txt

      # npm publishing runs after the GitHub release exists: the published package's
      # `pulumi.server` field points consumers at that release for the plugin binary, so a package
      # on npm ahead of its release would be broken for anyone who installed it in between.
      #
      # `make build_nodejs` regenerates the SDK at PROVIDER_VERSION, runs tsc, and stages
      # package.json + README + LICENSE into sdk/nodejs/bin - that directory is what gets published.
      - name: Build Node.js SDK
        run: make build_nodejs

      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0. The root mise.toml already
      # pins Node 22, but every Node 22.x line bundles npm 10.x (npm 11 only ships with Node 24),
      # so the CLI has to be upgraded in place. Done here rather than via actions/setup-node to
      # keep mise the single source of the toolchain, and deliberately after `make build_nodejs`
      # so the SDK is still built on the exact npm/yarn everything else uses.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g "npm@^11.5.1"
          npm --version

      - name: Publish Node.js SDK to npm
        # No NODE_AUTH_TOKEN and no ~/.npmrc: npm detects the Actions OIDC environment and
        # exchanges the job's id-token for a short-lived credential. Writing an `_authToken=` line
        # (which is also what actions/setup-node's `registry-url` input does) actively breaks this
        # -- npm reads the empty value as "auth already configured", skips the OIDC exchange, and
        # fails with ENEEDAUTH. See https://github.com/npm/documentation/issues/1960.
        #
        # Skipped rather than failed when the version is already on npm, so re-running a release
        # to fix a later step doesn't dead-end on npm's immutable-version rule.
        run: |
          cd sdk/nodejs/bin
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          echo "publishing $name@$version"

          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::notice::$name@$version is already published; skipping"
            exit 0
          fi

          # --access public is required on every publish of a scoped package: npm defaults scoped
          # packages to restricted, which a free account cannot host. --provenance is not passed:
          # trusted publishing attests provenance automatically.
          npm publish --access public
