# Publishes a GitHub Release with prebuilt provider binaries when a vX.Y.Z tag is pushed.
#
# Unlike release.yml/prerelease.yml (autogenerated by pulumi/ci-mgmt), this workflow does not
# depend on Pulumi's internal ESC/OIDC secrets or registry publishing (npm/PyPI/NuGet). It only
# needs the default GITHUB_TOKEN. Consumers install the plugin directly from the GitHub release,
# e.g. `pulumi plugin install resource komodor <version> --server github://api.github.com/phillipedwards/pulumi-komodor`.
name: gh-release

on:
  push:
    tags:
      - v*.*.*
  # Allows re-running a release without deleting and re-pushing the tag.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading "v" (e.g. 0.1.0). The tag must already exist.'
        required: true
        type: string

permissions:
  contents: write

env:
  PULUMI_CONVERTER_TERRAFORM_VERSION: 1.3.0
  # `make schema` exports PULUMI_HOME=$(WORKING_DIR)/.pulumi, and runs with automatic plugin
  # acquisition disabled. The converter therefore has to be installed into that same PULUMI_HOME,
  # not the default ~/.pulumi, or tfgen panics with "no converter plugin found".
  PULUMI_HOME: ${{ github.workspace }}/.pulumi

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Determine provider version
        # Passed through env rather than interpolated into the script directly, so a crafted
        # dispatch input cannot inject shell.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          # The Makefile rejects a leading "v", so fail loudly rather than mid-build.
          case "$version" in
            v*) echo "::error::version must not start with 'v', got '$version'"; exit 1 ;;
          esac
          echo "PROVIDER_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"

      # Provides Go and the Pulumi CLI at the versions pinned in .config/mise.toml, which derives
      # them from provider/go.mod. This is also what every ci-mgmt-generated workflow uses; every
      # `make` target here depends on it.
      - name: Setup mise
        uses: jdx/mise-action@146a28175021df8ca24f8ee1828cc2a60f980bd5 # v3
        env:
          MISE_FETCH_REMOTE_VERSIONS_TIMEOUT: 30s
        with:
          version: 2025.11.6
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install terraform converter plugin
        run: pulumi plugin install converter terraform "$PULUMI_CONVERTER_TERRAFORM_VERSION"

      - name: Generate schema
        run: make schema

      - name: Build and package all platforms
        env:
          SKIP_SIGNING: "true"
        run: |
          # provider_dist covers linux/darwin amd64+arm64 and windows-amd64; windows-arm64 is a
          # separate target because it is excluded from the provider_dist aggregate.
          make provider_dist
          make provider_dist-windows-arm64

      - name: Calculate checksums
        working-directory: bin
        run: shasum -a 256 *.tar.gz > "pulumi-komodor_${PROVIDER_VERSION}_checksums.txt"

      - name: Verify release artifacts
        working-directory: bin
        run: |
          expected=6
          actual=$(ls -1 *.tar.gz | wc -l)
          if [ "$actual" -ne "$expected" ]; then
            echo "::error::expected $expected platform archives, found $actual"
            ls -la
            exit 1
          fi
          ls -la *.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            bin/*.tar.gz
            bin/*_checksums.txt
