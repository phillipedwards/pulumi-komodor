# Lint, test, and build on every PR and push to main.
#
# This replaces main.yml / run-acceptance-tests.yml, which are generated by pulumi/ci-mgmt for
# providers published by Pulumi itself. Those authenticate to Pulumi's internal ESC organization
# and sign Windows binaries with Pulumi's Azure key vault, so they can never pass in this repo -
# they failed at startup on every push. Note that `make ci-mgmt` will regenerate them.
name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PULUMI_CONVERTER_TERRAFORM_VERSION: 1.3.0
  # `make schema` exports PULUMI_HOME=$(WORKING_DIR)/.pulumi with automatic plugin acquisition
  # disabled, so the converter has to land in that same PULUMI_HOME rather than the default.
  PULUMI_HOME: ${{ github.workspace }}/.pulumi

jobs:
  lint:
    name: Lint provider
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@146a28175021df8ca24f8ee1828cc2a60f980bd5 # v3
        env:
          MISE_FETCH_REMOTE_VERSIONS_TIMEOUT: 30s
        with:
          version: 2025.11.6
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Runs golangci-lint 1.64.8 as pinned in .config/mise.toml. .golangci.yml is in the v1
      # config format, so a v2 binary from $PATH would fail to load it.
      #
      # This module pulls in the whole terraform-bridge dependency graph and golangci-lint gets
      # OOM-killed at default settings, so hold its parallelism and heap growth down.
      - name: Lint
        env:
          GOGC: "20"
          GOMAXPROCS: "2"
        run: make lint_provider

  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@146a28175021df8ca24f8ee1828cc2a60f980bd5 # v3
        env:
          MISE_FETCH_REMOTE_VERSIONS_TIMEOUT: 30s
        with:
          version: 2025.11.6
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install terraform converter plugin
        run: pulumi plugin install converter terraform "$PULUMI_CONVERTER_TERRAFORM_VERSION"

      - name: Build provider
        run: make provider

      - name: Test provider
        run: make test_provider

      - name: Regenerate schema and SDKs
        run: make generate

      # schema.json is what gets embedded in the released provider binary, so it must match
      # resources.go. Checked on its own rather than over all of sdk/, because the language
      # codegen emits different output on different toolchains (the Go invoke helpers and the
      # dotnet dotfiles differ between a macOS dev box and this runner even at identical
      # pulumi/pkg versions), which would make a whole-tree check fail for reasons unrelated
      # to the change under test.
      - name: Check schema is up to date
        run: |
          if ! git diff --quiet -- provider/cmd/pulumi-resource-komodor; then
            echo "::error::schema is out of date - run 'make generate' and commit the result"
            git diff --stat -- provider/cmd/pulumi-resource-komodor
            echo "----- patch -----"
            git diff -- provider/cmd/pulumi-resource-komodor | head -300
            exit 1
          fi
          echo "schema.json and bridge-metadata.json are current"

      # Reported but not enforced, for the codegen-nondeterminism reason above.
      - name: Report SDK drift
        if: always()
        run: |
          if ! git diff --quiet -- sdk; then
            echo "::warning::regenerating produced SDK changes; see diffstat below"
            git diff --stat -- sdk
          else
            echo "no SDK drift"
          fi

      - name: Build SDKs
        run: make build_sdks
